image: golang:1.26
stages: [test, release]

# One pipeline per change: with an open MR, only the MR pipeline runs (the
# branch push pipeline is suppressed); a push with no MR (main) and tags run
# the classic branch/tag pipeline.
workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS'
      when: never
    - if: '$CI_COMMIT_BRANCH'
    - if: '$CI_COMMIT_TAG'

# Every job pins to the self-hosted linux runner shared with the hub
# (orbstack, tag linux-docker) — the gitlab.com shared runners run on the
# free-tier quota, which is exhausted (every recent main pipeline failed
# with ci_quota_exceeded, never a code error).
default:
  tags:
    - linux-docker

test:
  stage: test
  # Explicit rules so the suite also runs on MR pipelines (a rule-less job
  # is skipped there) — and still on branch/main pushes.
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_PIPELINE_SOURCE == "push"'
  # A few internal/app tests are timing-sensitive under load (elision
  # windows, telemetry ring vs the autocommit worker) — auto-retry once
  # while they are made deterministic (tracked as its own task).
  retry: 1
  script:
    - go vet ./...
    - go test ./... -count=1

# ui/dist is go:embed-ed into the binary, so the *committed* dist is what ships —
# a change to ui/src that forgets to rebuild ui/dist serves a stale UI (F-0136).
# This gate rebuilds on the canonical platform (node:24 Linux — the same image the
# baseline dist is built with) and fails if the committed dist drifts. The build is
# deterministic via npm ci (exact lockfile) + pinned image. `git add` before the diff
# so new/removed chunk files count as drift, not just modified ones.
ui:dist-drift:
  stage: test
  image: node:24
  rules:
    - changes:
        - ui/**/*
  script:
    - cd ui && npm ci && npm run build && cd ..
    - git add -A ui/dist
    - git diff --cached --exit-code -- ui/dist

# On a tag (vX.Y.Z): cross-compile the matrix with the tag stamped as version,
# then upload each binary + SHA256SUMS to the generic package registry.
build:release:
  stage: release
  rules:
    - if: '$CI_COMMIT_TAG'
  script:
    - bash scripts/build-release.sh "$CI_COMMIT_TAG"
    - |
      for f in dist/cerne_* dist/SHA256SUMS; do
        name="$(basename "$f")"
        echo "uploading $name"
        curl --fail --silent --show-error \
          --header "JOB-TOKEN: ${CI_JOB_TOKEN}" \
          --upload-file "$f" \
          "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/cerne/${CI_COMMIT_TAG}/${name}"
      done
  artifacts:
    paths:
      - dist/
    expire_in: 30 days

# Create the GitLab Release linking the uploaded package-registry assets.
release:
  stage: release
  rules:
    - if: '$CI_COMMIT_TAG'
  needs: ["build:release"]
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  script:
    - echo "Releasing cerne ${CI_COMMIT_TAG}"
  release:
    tag_name: '$CI_COMMIT_TAG'
    name: 'cerne $CI_COMMIT_TAG'
    description: 'Binários cross-compilados (win/mac/linux, amd64+arm64) + SHA256SUMS no Package Registry.'
    assets:
      links:
        - name: 'cerne_${CI_COMMIT_TAG}_linux_amd64'
          url: '${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/cerne/${CI_COMMIT_TAG}/cerne_${CI_COMMIT_TAG}_linux_amd64'
        - name: 'cerne_${CI_COMMIT_TAG}_linux_arm64'
          url: '${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/cerne/${CI_COMMIT_TAG}/cerne_${CI_COMMIT_TAG}_linux_arm64'
        - name: 'cerne_${CI_COMMIT_TAG}_darwin_amd64'
          url: '${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/cerne/${CI_COMMIT_TAG}/cerne_${CI_COMMIT_TAG}_darwin_amd64'
        - name: 'cerne_${CI_COMMIT_TAG}_darwin_arm64'
          url: '${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/cerne/${CI_COMMIT_TAG}/cerne_${CI_COMMIT_TAG}_darwin_arm64'
        - name: 'cerne_${CI_COMMIT_TAG}_windows_amd64.exe'
          url: '${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/cerne/${CI_COMMIT_TAG}/cerne_${CI_COMMIT_TAG}_windows_amd64.exe'
        - name: 'SHA256SUMS'
          url: '${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/cerne/${CI_COMMIT_TAG}/SHA256SUMS'
