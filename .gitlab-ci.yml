image: golang:1.26
stages: [test, release]

test:
  stage: test
  script:
    - go vet ./...
    - go test ./... -count=1

# On a tag (vX.Y.Z): cross-compile the matrix with the tag stamped as version,
# then upload each binary + SHA256SUMS to the generic package registry.
build:release:
  stage: release
  rules:
    - if: '$CI_COMMIT_TAG'
  script:
    - bash scripts/build-release.sh "$CI_COMMIT_TAG"
    - |
      for f in dist/cerne_* dist/SHA256SUMS; do
        name="$(basename "$f")"
        echo "uploading $name"
        curl --fail --silent --show-error \
          --header "JOB-TOKEN: ${CI_JOB_TOKEN}" \
          --upload-file "$f" \
          "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/cerne/${CI_COMMIT_TAG}/${name}"
      done
  artifacts:
    paths:
      - dist/
    expire_in: 30 days

# Create the GitLab Release linking the uploaded package-registry assets.
release:
  stage: release
  rules:
    - if: '$CI_COMMIT_TAG'
  needs: ["build:release"]
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  script:
    - echo "Releasing cerne ${CI_COMMIT_TAG}"
  release:
    tag_name: '$CI_COMMIT_TAG'
    name: 'cerne $CI_COMMIT_TAG'
    description: 'Binários cross-compilados (win/mac/linux, amd64+arm64) + SHA256SUMS no Package Registry.'
    assets:
      links:
        - name: 'cerne_${CI_COMMIT_TAG}_linux_amd64'
          url: '${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/cerne/${CI_COMMIT_TAG}/cerne_${CI_COMMIT_TAG}_linux_amd64'
        - name: 'cerne_${CI_COMMIT_TAG}_linux_arm64'
          url: '${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/cerne/${CI_COMMIT_TAG}/cerne_${CI_COMMIT_TAG}_linux_arm64'
        - name: 'cerne_${CI_COMMIT_TAG}_darwin_amd64'
          url: '${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/cerne/${CI_COMMIT_TAG}/cerne_${CI_COMMIT_TAG}_darwin_amd64'
        - name: 'cerne_${CI_COMMIT_TAG}_darwin_arm64'
          url: '${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/cerne/${CI_COMMIT_TAG}/cerne_${CI_COMMIT_TAG}_darwin_arm64'
        - name: 'cerne_${CI_COMMIT_TAG}_windows_amd64.exe'
          url: '${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/cerne/${CI_COMMIT_TAG}/cerne_${CI_COMMIT_TAG}_windows_amd64.exe'
        - name: 'SHA256SUMS'
          url: '${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/cerne/${CI_COMMIT_TAG}/SHA256SUMS'
