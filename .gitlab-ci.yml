image: golang:1.26
stages: [test, pin, release]

# One pipeline per change: with an open MR, only the MR pipeline runs (the
# branch push pipeline is suppressed); a push with no MR (main) and tags run
# the classic branch/tag pipeline.
workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS'
      when: never
    - if: '$CI_COMMIT_BRANCH'
    - if: '$CI_COMMIT_TAG'

# Every job pins to the self-hosted linux runner shared with the hub
# (orbstack, tag linux-docker) — the gitlab.com shared runners run on the
# free-tier quota, which is exhausted (every recent main pipeline failed
# with ci_quota_exceeded, never a code error).
default:
  tags:
    - linux-docker

test:
  stage: test
  # Explicit rules so the suite also runs on MR pipelines (a rule-less job
  # is skipped there) — and still on branch/main pushes.
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_PIPELINE_SOURCE == "push"'
  # retry guards infra hiccups (runner death); the flaky-family retry is
  # the surgical internal/app loop below.
  retry: 1
  script:
    - go vet ./...
    # The timing-sensitive family (elision windows, telemetry ring racing
    # the autocommit worker) lives in internal/app and flakes under runner
    # load — up to 3 attempts for that package alone while it is made
    # deterministic (tracked as its own task); everything else runs once.
    # -timeout 30m matches the gate documented in CLAUDE.md (F-0289). Inert here
    # — this job runs in ~4min — and that is the point: local and CI must not
    # diverge on the timeout axis, or "the gate" means two different things.
    - go test $(go list ./... | grep -v '/internal/app$') -count=1 -timeout 30m
    - for i in 1 2 3; do go test ./internal/app -count=1 -timeout 30m && break; [ $i -eq 3 ] && exit 1; done

# ui/dist is go:embed-ed into the binary, so the *committed* dist is what ships —
# a change to ui/src that forgets to rebuild ui/dist serves a stale UI (F-0136).
# This gate rebuilds on the canonical platform (node:24 Linux — the same image the
# baseline dist is built with) and fails if the committed dist drifts. The build is
# deterministic via npm ci (exact lockfile) + pinned image. `git add` before the diff
# so new/removed chunk files count as drift, not just modified ones.
ui:dist-drift:
  stage: test
  image: node:24
  rules:
    - changes:
        - ui/**/*
  script:
    - cd ui && npm ci && npm run build && cd ..
    - git add -A ui/dist
    - git diff --cached --exit-code -- ui/dist

# docs.lock is a main-branch CI artifact (F-0198). Reject client-written pins
# before merge, including pins produced by stale cerne binaries.
docs-lock:immutable:
  stage: test
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - docs.lock
  script:
    - echo "docs.lock is maintained only by the main-branch CI writer; remove it from this merge request"
    - exit 1

# The only writer of the committed documentation snapshot pin. The resource
# group serializes pipelines, and the checkout refresh makes an older pipeline
# pin the latest main instead of racing from its original detached SHA.
#
# `cerne lock pin` clones the cerne-docs backend over SSH, so the job needs a
# credential the runner image lacks: CERNE_DOCS_DEPLOY_KEY, a protected
# *file-type* CI/CD variable holding an unencrypted ed25519 private key whose
# public half is a read-only deploy key on rockt/cerne-docs. Without it the
# job skips with a message instead of failing every main pipeline.
docs-lock:pin:
  stage: pin
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
  resource_group: docs-lock-pin
  script:
    - |
      set -eu
      if [ -z "${CERNE_DOCS_DEPLOY_KEY:-}" ]; then
        echo "skipping docs.lock pin: CERNE_DOCS_DEPLOY_KEY is not set."
        echo "Provision a read-only deploy key for git@gitlab.com:rockt/cerne-docs.git and add its"
        echo "private half as a protected file-type CI/CD variable named CERNE_DOCS_DEPLOY_KEY."
        exit 0
      fi
      mkdir -p ~/.ssh && chmod 700 ~/.ssh
      install -m 600 "$CERNE_DOCS_DEPLOY_KEY" ~/.ssh/id_ed25519
      echo 'gitlab.com ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIAfuCHKVTjquxvt6CM6tdG4SLp1Btn/nOeHHE5UOzRdf' >> ~/.ssh/known_hosts
      git fetch origin "$CI_DEFAULT_BRANCH"
      git checkout -B "$CI_DEFAULT_BRANCH" "origin/$CI_DEFAULT_BRANCH"
      go run ./cmd/cerne lock pin

      changed="$(git diff --name-only)"
      if [ -n "$changed" ] && [ "$changed" != "docs.lock" ]; then
        echo "refusing to pin: unexpected changed paths:"
        echo "$changed"
        exit 1
      fi
      if git diff --quiet -- docs.lock; then
        echo "docs.lock already points at the current backend snapshot"
        exit 0
      fi

      git config user.name "cerne-ci"
      git config user.email "cerne-ci@rockt.com"
      git add docs.lock
      git commit -m "chore(docs): pin docs.lock [skip ci]"
      git push -o ci.skip \
        "https://gitlab-ci-token:${CI_JOB_TOKEN}@${CI_SERVER_HOST}/${CI_PROJECT_PATH}.git" \
        "HEAD:${CI_DEFAULT_BRANCH}"

# On a tag (vX.Y.Z): cross-compile the matrix with the tag stamped as version,
# then upload each binary + SHA256SUMS to the generic package registry.
build:release:
  stage: release
  rules:
    - if: '$CI_COMMIT_TAG'
  script:
    - bash scripts/build-release.sh "$CI_COMMIT_TAG"
    - |
      for f in dist/cerne_* dist/SHA256SUMS; do
        name="$(basename "$f")"
        echo "uploading $name"
        curl --fail --silent --show-error \
          --header "JOB-TOKEN: ${CI_JOB_TOKEN}" \
          --upload-file "$f" \
          "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/cerne/${CI_COMMIT_TAG}/${name}"
      done
  artifacts:
    paths:
      - dist/
    expire_in: 30 days

# Create the GitLab Release linking the uploaded package-registry assets.
release:
  stage: release
  rules:
    - if: '$CI_COMMIT_TAG'
  needs: ["build:release"]
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  script:
    - echo "Releasing cerne ${CI_COMMIT_TAG}"
  release:
    tag_name: '$CI_COMMIT_TAG'
    name: 'cerne $CI_COMMIT_TAG'
    description: 'Binários cross-compilados (win/mac/linux, amd64+arm64) + SHA256SUMS no Package Registry.'
    assets:
      links:
        - name: 'cerne_${CI_COMMIT_TAG}_linux_amd64'
          url: '${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/cerne/${CI_COMMIT_TAG}/cerne_${CI_COMMIT_TAG}_linux_amd64'
        - name: 'cerne_${CI_COMMIT_TAG}_linux_arm64'
          url: '${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/cerne/${CI_COMMIT_TAG}/cerne_${CI_COMMIT_TAG}_linux_arm64'
        - name: 'cerne_${CI_COMMIT_TAG}_darwin_amd64'
          url: '${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/cerne/${CI_COMMIT_TAG}/cerne_${CI_COMMIT_TAG}_darwin_amd64'
        - name: 'cerne_${CI_COMMIT_TAG}_darwin_arm64'
          url: '${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/cerne/${CI_COMMIT_TAG}/cerne_${CI_COMMIT_TAG}_darwin_arm64'
        - name: 'cerne_${CI_COMMIT_TAG}_windows_amd64.exe'
          url: '${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/cerne/${CI_COMMIT_TAG}/cerne_${CI_COMMIT_TAG}_windows_amd64.exe'
        - name: 'SHA256SUMS'
          url: '${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/cerne/${CI_COMMIT_TAG}/SHA256SUMS'
