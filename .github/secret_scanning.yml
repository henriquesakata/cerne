# GitHub secret scanning: skip the embedded UI build output.
#
# ui/dist bundles @excalidraw/excalidraw, which ships excalidraw.com's public
# Firebase web config (an "AIza…" key) — a vendor client key, not a secret of
# this project, re-emitted under a new hashed filename on every UI rebuild.
# ui/dist is NOT unguarded: gitleaks in ci.yml still scans it, allowlisting
# only that key on its VITE_APP_FIREBASE_CONFIG line (see .gitleaks.toml).
paths-ignore:
  - "ui/dist/**"
