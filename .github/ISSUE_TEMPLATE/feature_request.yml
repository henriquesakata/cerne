name: Feature request
description: A concrete change you would like to see. For a loose idea, use Discussions.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What you were trying to do and where cerne got in the way. A real situation beats a hypothetical one.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What you would like
      description: The behaviour you want. A command and its expected output is ideal.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: What you do today instead
