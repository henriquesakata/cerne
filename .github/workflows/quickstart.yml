name: quickstart

# The README tells a visitor to run `cerne init` and `cerne ui` with the binary
# install.sh gives them: the latest release, not main (F-0374). Run the
# <!-- quickstart --> blocks against that binary, so a README that runs ahead
# of the release fails here, naming the command and the version.
#
# The job fails red on purpose (no continue-on-error). main has no required
# checks, so it warns on the PR without blocking the merge; do not add it to
# a required-checks list.
#
# On a release, release.yml calls this workflow (workflow_call) after
# `gh release create` has uploaded the binaries and SHA256SUMS, with the tag
# in inputs.tag. It cannot listen for `release: published`: a release created
# with the workflow's GITHUB_TOKEN starts no other workflow, so that trigger
# never fired (F-0410). workflow_dispatch reruns it for any tag by hand.
on:
  pull_request:
    paths: [README.md, INSTALL.md, install.sh, install.ps1, scripts/quickstart-check.sh, scripts/homebrew-formula.sh, .github/workflows/quickstart.yml]
  workflow_call:
    inputs:
      tag:
        type: string
        required: true
  workflow_dispatch:
    inputs:
      tag:
        description: release tag to install (e.g. v0.10.0)
        type: string
        required: true

permissions:
  contents: read

jobs:
  quickstart:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      # The PR's own install.sh. On a release, pin to the tag just published
      # (inputs.tag); on a PR, the latest release is what a visitor gets.
      - name: Install cerne
        env:
          CERNE_VERSION: ${{ inputs.tag || '' }}
          CERNE_INSTALL_DIR: ${{ runner.temp }}/cerne-bin
        run: |
          mkdir -p "$CERNE_INSTALL_DIR"
          sh install.sh | tee "$RUNNER_TEMP/install.log"
          "$CERNE_INSTALL_DIR/cerne" --version
          installed=$(sed -n 's/^Installed cerne \([^ ]*\) to .*/\1/p' "$RUNNER_TEMP/install.log")
          # On a release, install.sh must have honored the tag just published.
          if [ -n "$CERNE_VERSION" ] && [ "$installed" != "$CERNE_VERSION" ]; then
            echo "quickstart: installed '$installed' but the published release is '$CERNE_VERSION'" >&2
            exit 1
          fi
          echo "QUICKSTART_TAG=$installed" >>"$GITHUB_ENV"
      - name: Run the quickstart blocks
        run: |
          for f in README.md INSTALL.md; do
            sh scripts/quickstart-check.sh "$f" "$RUNNER_TEMP/cerne-bin/cerne"
          done

  # Windows end to end (F-0410): the PR's own install.ps1 against the latest
  # release (the tag just published, on a release), then the first commands a
  # visitor runs.
  quickstart-windows:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install cerne with install.ps1
        shell: pwsh
        env:
          CERNE_VERSION: ${{ inputs.tag || '' }}
          CERNE_INSTALL_DIR: ${{ runner.temp }}\cerne-bin
        run: |
          # As the README runs it: the script text through Invoke-Expression.
          $log = Get-Content -Raw install.ps1 | Invoke-Expression *>&1 | Out-String
          Write-Host $log
          if ($log -notmatch 'Installed cerne (\S+) to ') { throw 'install.ps1 did not report an install' }
          $installed = $Matches[1]
          if ($env:CERNE_VERSION -and $installed -ne $env:CERNE_VERSION) {
            throw "quickstart: installed '$installed' but the published release is '$env:CERNE_VERSION'"
          }
          Add-Content $env:GITHUB_PATH $env:CERNE_INSTALL_DIR
      - name: cerne --version and cerne init
        shell: pwsh
        env:
          GIT_AUTHOR_NAME: quickstart
          GIT_AUTHOR_EMAIL: quickstart@example.invalid
          GIT_COMMITTER_NAME: quickstart
          GIT_COMMITTER_EMAIL: quickstart@example.invalid
        run: |
          $work = Join-Path $env:RUNNER_TEMP 'quickstart'
          $env:CERNE_CACHE_DIR = "$work\cache"; $env:CERNE_DATA_DIR = "$work\data"; $env:CERNE_CONFIG_DIR = "$work\config"
          New-Item -ItemType Directory -Force "$work\repo" | Out-Null
          Set-Location "$work\repo"
          cerne --version
          if ($LASTEXITCODE) { throw "cerne --version exited $LASTEXITCODE" }
          git init -q
          if ($LASTEXITCODE) { throw "git init exited $LASTEXITCODE" }
          cerne init --name demo
          if ($LASTEXITCODE) { throw "cerne init exited $LASTEXITCODE" }
          if (-not (Test-Path .cernerc)) { throw 'cerne init wrote no .cernerc' }

  # The formula the release will push to the tap, rendered from the latest
  # published release and installed through a local tap: a broken formula
  # fails here, on the PR, not after the binaries are out (F-0410).
  homebrew-formula:
    if: github.event_name == 'pull_request'
    strategy:
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install the rendered formula
        env:
          HOMEBREW_NO_AUTO_UPDATE: '1'
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! command -v brew >/dev/null; then eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv)"; fi
          tag=$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName -q .tagName)
          gh release download "$tag" --repo "$GITHUB_REPOSITORY" -p SHA256SUMS -D "$RUNNER_TEMP"
          brew tap-new --no-git cerne-ci/local
          sh scripts/homebrew-formula.sh "$tag" "$RUNNER_TEMP/SHA256SUMS" >"$(brew --repository cerne-ci/local)/Formula/cerne.rb"
          brew install cerne-ci/local/cerne
          brew test cerne-ci/local/cerne
          "$(brew --prefix)/bin/cerne" --version
