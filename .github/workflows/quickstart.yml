name: quickstart

# The README tells a visitor to run `cerne init` and `cerne ui` with the binary
# install.sh gives them: the latest release, not main (F-0374). Run the
# <!-- quickstart --> blocks against that binary, so a README that runs ahead
# of the release fails here, naming the command and the version.
#
# The job fails red on purpose (no continue-on-error). main has no required
# checks, so it warns on the PR without blocking the merge; do not add it to
# a required-checks list. The release event fires after `gh release create`,
# which uploads the binaries and SHA256SUMS in the same call (release.yml), so
# the assets exist when this runs.
on:
  pull_request:
    paths: [README.md, INSTALL.md, install.sh, scripts/quickstart-check.sh]
  release:
    types: [published]

permissions:
  contents: read

jobs:
  quickstart:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      # The PR's own install.sh. On a release, pin to the tag just published;
      # on a PR, the latest release is what a visitor gets.
      - name: Install cerne
        env:
          CERNE_VERSION: ${{ github.event_name == 'release' && github.event.release.tag_name || '' }}
          CERNE_INSTALL_DIR: ${{ runner.temp }}/cerne-bin
        run: |
          mkdir -p "$CERNE_INSTALL_DIR"
          sh install.sh | tee "$RUNNER_TEMP/install.log"
          "$CERNE_INSTALL_DIR/cerne" --version
          installed=$(sed -n 's/^Installed cerne \([^ ]*\) to .*/\1/p' "$RUNNER_TEMP/install.log")
          # On a release, install.sh must have honored the tag just published.
          if [ -n "$CERNE_VERSION" ] && [ "$installed" != "$CERNE_VERSION" ]; then
            echo "quickstart: installed '$installed' but the published release is '$CERNE_VERSION'" >&2
            exit 1
          fi
          echo "QUICKSTART_TAG=$installed" >>"$GITHUB_ENV"
      - name: Run the quickstart blocks
        run: |
          for f in README.md INSTALL.md; do
            sh scripts/quickstart-check.sh "$f" "$RUNNER_TEMP/cerne-bin/cerne"
          done
