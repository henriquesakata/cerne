name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: release notes extractor
        run: sh scripts/release-notes_test.sh
      - name: release body script
        run: sh scripts/release-body_test.sh
      - name: release publish script
        run: sh scripts/release-publish_test.sh
      - name: MCP Registry publish script
        run: sh scripts/mcp-registry-publish_test.sh
      - run: go vet ./...
      # -timeout 30m is required, not decorative: the default is 10 min per
      # package and internal/cli + internal/app spawn real git per test (F-0289).
      - run: go test $(go list ./... | grep -v '/internal/app$') -count=1 -timeout 30m
      # internal/app runs apart with up to 3 attempts, as on the previous CI.
      - name: go test ./internal/app
        run: |
          for i in 1 2 3; do
            go test ./internal/app -count=1 -timeout 30m && exit 0
          done
          exit 1

  # install.ps1 runs only on Windows, in both PowerShell hosts the runner has
  # (5.1 and 7); the rest of the suite stays on Linux (F-0410). The
  # selfupdate tests swap a running cerne.exe, which only Windows locks
  # (F-0476).
  install-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go test ./e2e/ -run TestInstallPS1 -count=1 -v
      - run: go test ./internal/selfupdate/ -count=1 -v
