name: release

# A v* tag cross-compiles the release matrix (scripts/build-release.sh stamps
# internal/version.Version), attests the binaries' provenance, publishes a
# GitHub Release with the binaries and SHA256SUMS, and points the Homebrew tap
# at it (F-0410).
on:
  push:
    tags: ['v*']

permissions:
  contents: write
  id-token: write # Sigstore signing of the provenance attestations
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      # The release body is the tag's CHANGELOG.md section. Extracted before the
      # build so a missing section fails the run in seconds, with nothing built.
      - name: extract the release notes
        run: sh scripts/release-notes.sh "$GITHUB_REF_NAME" >"$RUNNER_TEMP/changelog-section.md"
      - run: bash scripts/build-release.sh "$GITHUB_REF_NAME"
      # The MCP Registry listing (F-0455): dist/cerne_<tag>.mcpb (the binaries,
      # the MCPB manifest and its launcher; its hash appended to SHA256SUMS) and
      # dist/server.json pointing at it. Built before the attestation so both
      # are attested and uploaded with the rest of dist/.
      - run: sh scripts/mcpb-bundle.sh "$GITHUB_REF_NAME"
      # Verifiable with `gh attestation verify <file> --repo henriquesakata/cerne`.
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: 'dist/*'
      # Body = the CHANGELOG section, then the fixed Update, Install and Verify blocks.
      # A tag with a hyphen (v1.0.0-rc.1) is published as a pre-release.
      - name: publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes="$RUNNER_TEMP/notes.md"
          sh scripts/release-body.sh "$GITHUB_REF_NAME" "$RUNNER_TEMP/changelog-section.md" >"$notes"
          sh scripts/release-publish.sh "$GITHUB_REF_NAME" "$notes" dist/*
      # The workflow token cannot write to another repository: HOMEBREW_TAP_TOKEN
      # is a fine-grained token with contents:write on henriquesakata/homebrew-tap
      # only. Without it the job fails, so a stale tap never passes in silence.
      # A prerelease tag (v1.0.0-rc.1) leaves the tap alone: brew users get
      # stable releases only.
      - name: check the Homebrew tap token
        if: ${{ !contains(github.ref_name, '-') }}
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          if [ -z "$TAP_TOKEN" ]; then
            echo "::error::HOMEBREW_TAP_TOKEN is not set: the release is published, but the Homebrew tap still installs the previous version"
            exit 1
          fi
      - uses: actions/checkout@v4
        if: ${{ !contains(github.ref_name, '-') }}
        with:
          repository: henriquesakata/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: homebrew-tap
      - name: update the Homebrew tap
        if: ${{ !contains(github.ref_name, '-') }}
        run: |
          mkdir -p homebrew-tap/Formula
          sh scripts/homebrew-formula.sh "$GITHUB_REF_NAME" dist/SHA256SUMS >homebrew-tap/Formula/cerne.rb
          cd homebrew-tap
          git add Formula/cerne.rb
          # A re-run on the same tag has nothing to commit.
          git diff --cached --quiet || git -c user.name='github-actions[bot]' \
            -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit -q -m "cerne $GITHUB_REF_NAME"
          git push -q origin HEAD
      # The Scoop bucket, the same way (F-0508): SCOOP_BUCKET_TOKEN is a
      # fine-grained token with contents:write on henriquesakata/scoop-bucket
      # only; without it the job fails, so a stale bucket never passes in
      # silence. A prerelease tag leaves the bucket alone.
      - name: check the Scoop bucket token
        if: ${{ !contains(github.ref_name, '-') }}
        env:
          BUCKET_TOKEN: ${{ secrets.SCOOP_BUCKET_TOKEN }}
        run: |
          if [ -z "$BUCKET_TOKEN" ]; then
            echo "::error::SCOOP_BUCKET_TOKEN is not set: the release is published, but the Scoop bucket still installs the previous version"
            exit 1
          fi
      - uses: actions/checkout@v4
        if: ${{ !contains(github.ref_name, '-') }}
        with:
          repository: henriquesakata/scoop-bucket
          token: ${{ secrets.SCOOP_BUCKET_TOKEN }}
          path: scoop-bucket
      - name: update the Scoop bucket
        if: ${{ !contains(github.ref_name, '-') }}
        run: |
          mkdir -p scoop-bucket/bucket
          sh scripts/scoop-manifest.sh "$GITHUB_REF_NAME" dist/SHA256SUMS >scoop-bucket/bucket/cerne.json
          cd scoop-bucket
          git add bucket/cerne.json
          # A re-run on the same tag has nothing to commit.
          git diff --cached --quiet || git -c user.name='github-actions[bot]' \
            -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit -q -m "cerne $GITHUB_REF_NAME"
          git push -q origin HEAD

  # Install from the tap just updated, the way INSTALL.md says, and check the
  # binary reports the tag (cerne --version prints the full version).
  brew-check:
    needs: release
    if: ${{ !contains(github.ref_name, '-') }}
    permissions:
      contents: read
    strategy:
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: brew install henriquesakata/tap/cerne
        env:
          HOMEBREW_NO_AUTO_UPDATE: '1'
        run: |
          # The Linux runner ships Homebrew off the PATH.
          if ! command -v brew >/dev/null; then eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv)"; fi
          brew install henriquesakata/tap/cerne
          brew test henriquesakata/tap/cerne
          want="cerne ${GITHUB_REF_NAME#v}"
          got=$("$(brew --prefix)/bin/cerne" --version)
          echo "$got"
          if [ "$got" != "$want" ]; then
            echo "::error::brew installed '$got', want '$want'"
            exit 1
          fi

  # Install from the Scoop bucket just updated, the way INSTALL.md says, and
  # check the binary reports the tag and that cerne update leaves a Scoop
  # install to Scoop (F-0508).
  scoop-check:
    needs: release
    if: ${{ !contains(github.ref_name, '-') }}
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - name: scoop install henriquesakata/cerne
        run: |
          iex "& {$(irm get.scoop.sh)} -RunAsAdmin"
          $env:PATH = "$HOME\scoop\shims;$env:PATH"
          scoop bucket add henriquesakata https://github.com/henriquesakata/scoop-bucket
          scoop install henriquesakata/cerne
          $want = "cerne $($env:GITHUB_REF_NAME.TrimStart('v'))"
          $got = (cerne --version)
          Write-Host $got
          if ($got -ne $want) {
            Write-Host "::error::scoop installed '$got', want '$want'"
            exit 1
          }
          # cerne update exits 1 by design when a part is not done, and native
          # stderr must not become an error: capture it, assert on the binary
          # line, then clear the exit code the step would otherwise end with.
          $ErrorActionPreference = 'Continue'
          $out = (cerne update 2>&1 | Out-String)
          $ErrorActionPreference = 'Stop'
          Write-Host $out
          if ($out -notmatch '(?m)^binary: not done.*scoop update cerne') {
            Write-Host "::error::the binary line of cerne update did not name 'scoop update cerne'"
            exit 1
          }
          $global:LASTEXITCODE = 0

  # The Arch User Repository package cerne-bin (F-0507). scripts/aur-check.sh
  # builds and installs the package in this container first; only then the
  # PKGBUILD and .SRCINFO go to the AUR git repository over SSH. The host key is
  # pinned below, never scanned: these three lines were checked against the
  # fingerprints published on https://aur.archlinux.org/ (Ed25519
  # SHA256:RFzBCUItH9LZS0cKB5UE6ceAYhBD5C8GeOBip8Z11+4, ECDSA
  # SHA256:uTa/0PndEgPZTf76e1DFqXKJEXKsn7m9ivhLQtzGOCI, RSA
  # SHA256:5s5cIyReIfNNVGRFdDbe3hdYiI5OelHGpw2rOUud3Q8). If the AUR rotates a
  # key the push fails, the safe side: update the lines from that page.
  # AUR_SSH_PRIVATE_KEY is the private half of a key registered on the owner's
  # AUR account; without it the job fails, so a stale package never passes in
  # silence. A prerelease tag leaves the AUR alone, as it does the tap.
  # The job stays off until the owner has an AUR account and the key, and sets
  # the repository variable (AUR registration was closed at v0.16.0):
  #   gh variable set AUR_PUBLISH --body true --repo henriquesakata/cerne
  # aur-check needs this job, so it is skipped with it.
  aur:
    needs: release
    if: ${{ !contains(github.ref_name, '-') && vars.AUR_PUBLISH == 'true' }}
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    permissions:
      contents: read
    steps:
      - name: install git and ssh
        run: pacman -Syu --noconfirm --needed git openssh
      - uses: actions/checkout@v4
      - name: check the AUR key
        env:
          AUR_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
        run: |
          if [ -z "$AUR_KEY" ]; then
            echo "::error::AUR_SSH_PRIVATE_KEY is not set: the release is published, but the AUR still installs the previous version"
            exit 1
          fi
      - name: build and install the package
        run: sh scripts/aur-check.sh "$GITHUB_REF_NAME" aur-out
      - name: push to the AUR
        env:
          AUR_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
        run: |
          set -eu
          # Private files from the first byte; every path below is explicit
          # because OpenSSH finds ~ through the passwd entry, not $HOME.
          umask 077
          ssh_dir="$HOME/.ssh"
          mkdir -p "$ssh_dir"
          printf '%s\n' "$AUR_KEY" >"$ssh_dir/aur"
          cat >"$ssh_dir/known_hosts" <<'EOF'
          aur.archlinux.org ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIEuBKrPzbawxA/k2g6NcyV5jmqwJ2s+zpgZGZ7tpLIcN
          aur.archlinux.org ecdsa-sha2-nistp256 AAAAE2VjZHNhLXNoYTItbmlzdHAyNTYAAAAIbmlzdHAyNTYAAABBBLMiLrP8pVi5BFX2i3vepSUnpedeiewE5XptnUnau+ZoeUOPkpoCgZZuYfpaIQfhhJJI5qgnjJmr4hyJbe/zxow=
          aur.archlinux.org ssh-rsa 
          EOF
          export GIT_SSH_COMMAND="ssh -i $ssh_dir/aur -o IdentitiesOnly=yes -o UserKnownHostsFile=$ssh_dir/known_hosts -o StrictHostKeyChecking=yes"
          # A first push to a name nobody holds creates the package: the clone is empty.
          git clone -q ssh://aur@aur.archlinux.org/cerne-bin.git aur-repo
          cp aur-out/PKGBUILD aur-out/.SRCINFO aur-repo/
          cd aur-repo
          git add PKGBUILD .SRCINFO
          # A re-run on the same tag has nothing to commit.
          git diff --cached --quiet || git -c user.name='github-actions[bot]' \
            -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit -q -m "cerne $GITHUB_REF_NAME"
          git push -q origin HEAD:master

  # Install from the AUR just updated, the way INSTALL.md says, in a clean
  # container, and check the binary reports the tag.
  aur-check:
    needs: aur
    if: ${{ !contains(github.ref_name, '-') }}
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    permissions:
      contents: read
    steps:
      - name: makepkg -si from the AUR
        run: |
          set -eu
          pacman -Syu --noconfirm --needed git sudo
          useradd -m builder
          echo 'builder ALL=(root) NOPASSWD: /usr/bin/pacman' >/etc/sudoers.d/builder
          chmod 440 /etc/sudoers.d/builder
          su builder -c 'cd ~ && git clone https://aur.archlinux.org/cerne-bin.git && cd cerne-bin && makepkg -si --noconfirm'
          want="cerne ${GITHUB_REF_NAME#v}"
          got=$(cerne --version)
          echo "$got"
          if [ "$got" != "$want" ]; then
            echo "::error::the AUR installed '$got', want '$want'"
            exit 1
          fi

  # Lists the release in the official MCP Registry (F-0455), which Glama,
  # PulseMCP and other directories mirror, from the server.json the release
  # job uploaded. Every stable tag verifies mcp-publisher and validates that
  # server.json against the registry, with no login. A published version is
  # public and can never be changed or deleted, so the publish step stays off
  # until the owner has published the first version by hand and then sets the
  # repository variable:
  #   gh release download <tag> --repo henriquesakata/cerne -p server.json
  #   mcp-publisher login github        # as henriquesakata
  #   mcp-publisher publish server.json
  #   gh variable set MCP_REGISTRY_PUBLISH --body true --repo henriquesakata/cerne
  # A prerelease tag (v1.0.0-rc.1) never gets here, as with the Homebrew tap.
  # Its own job, so a registry outage leaves the tap and the checks alone.
  mcp-registry:
    needs: release
    if: ${{ !contains(github.ref_name, '-') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # GitHub OIDC login to the registry, no stored secret
    env:
      MCP_PUBLISHER_VERSION: v1.8.9
    steps:
      - uses: actions/checkout@v4
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      # A pinned release, verified against the registry's own release workflow
      # before it runs (the registry's GitHub Actions guide); never releases/latest.
      - name: download and verify mcp-publisher
        run: |
          set -eu
          archive=mcp-publisher_linux_amd64.tar.gz
          base="https://github.com/modelcontextprotocol/registry/releases/download/$MCP_PUBLISHER_VERSION"
          curl -fsSL -o "$archive" "$base/$archive"
          curl -fsSL -o "$archive.sigstore.json" "$base/$archive.sigstore.json"
          cosign verify-blob --bundle "$archive.sigstore.json" \
            --certificate-identity "https://github.com/modelcontextprotocol/registry/.github/workflows/release.yml@refs/tags/$MCP_PUBLISHER_VERSION" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            "$archive"
          tar xzf "$archive" mcp-publisher
      - name: validate the release's server.json
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" -p server.json -D "$RUNNER_TEMP"
          ./mcp-publisher validate "$RUNNER_TEMP/server.json"
      # Skips a version the registry already has (a re-run on the same tag).
      - name: publish to the MCP Registry
        if: ${{ vars.MCP_REGISTRY_PUBLISH == 'true' }}
        run: sh scripts/mcp-registry-publish.sh "$RUNNER_TEMP/server.json"

  # The README's commands against the release just published, on Linux and
  # Windows (quickstart.yml).
  quickstart:
    needs: release
    permissions:
      contents: read
    uses: ./.github/workflows/quickstart.yml
    with:
      tag: ${{ github.ref_name }}
