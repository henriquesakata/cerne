name: release

# A v* tag cross-compiles the release matrix (scripts/build-release.sh stamps
# internal/version.Version), attests the binaries' provenance, publishes a
# GitHub Release with the binaries and SHA256SUMS, and points the Homebrew tap
# at it (F-0410).
on:
  push:
    tags: ['v*']

permissions:
  contents: write
  id-token: write # Sigstore signing of the provenance attestations
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: bash scripts/build-release.sh "$GITHUB_REF_NAME"
      # Verifiable with `gh attestation verify <file> --repo henriquesakata/cerne`.
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: 'dist/*'
      - name: publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "$GITHUB_REF_NAME" dist/*
          --title "cerne $GITHUB_REF_NAME"
          --notes "Cross-compiled binaries (linux and darwin amd64/arm64, windows amd64) and SHA256SUMS. Install: https://github.com/$GITHUB_REPOSITORY/blob/$GITHUB_REF_NAME/INSTALL.md"
      # The workflow token cannot write to another repository: HOMEBREW_TAP_TOKEN
      # is a fine-grained token with contents:write on henriquesakata/homebrew-tap
      # only. Without it the job fails, so a stale tap never passes in silence.
      # A prerelease tag (v1.0.0-rc.1) leaves the tap alone: brew users get
      # stable releases only.
      - name: check the Homebrew tap token
        if: ${{ !contains(github.ref_name, '-') }}
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          if [ -z "$TAP_TOKEN" ]; then
            echo "::error::HOMEBREW_TAP_TOKEN is not set: the release is published, but the Homebrew tap still installs the previous version"
            exit 1
          fi
      - uses: actions/checkout@v4
        if: ${{ !contains(github.ref_name, '-') }}
        with:
          repository: henriquesakata/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: homebrew-tap
      - name: update the Homebrew tap
        if: ${{ !contains(github.ref_name, '-') }}
        run: |
          mkdir -p homebrew-tap/Formula
          sh scripts/homebrew-formula.sh "$GITHUB_REF_NAME" dist/SHA256SUMS >homebrew-tap/Formula/cerne.rb
          cd homebrew-tap
          git add Formula/cerne.rb
          # A re-run on the same tag has nothing to commit.
          git diff --cached --quiet || git -c user.name='github-actions[bot]' \
            -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit -q -m "cerne $GITHUB_REF_NAME"
          git push -q origin HEAD

  # Install from the tap just updated, the way INSTALL.md says, and check the
  # binary reports the tag (cerne --version prints MAJOR.MINOR).
  brew-check:
    needs: release
    if: ${{ !contains(github.ref_name, '-') }}
    permissions:
      contents: read
    strategy:
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: brew install henriquesakata/tap/cerne
        env:
          HOMEBREW_NO_AUTO_UPDATE: '1'
        run: |
          # The Linux runner ships Homebrew off the PATH.
          if ! command -v brew >/dev/null; then eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv)"; fi
          brew install henriquesakata/tap/cerne
          brew test henriquesakata/tap/cerne
          want="cerne $(echo "${GITHUB_REF_NAME#v}" | cut -d. -f1,2)"
          got=$("$(brew --prefix)/bin/cerne" --version)
          echo "$got"
          if [ "$got" != "$want" ]; then
            echo "::error::brew installed '$got', want '$want'"
            exit 1
          fi

  # The README's commands against the release just published, on Linux and
  # Windows (quickstart.yml).
  quickstart:
    needs: release
    permissions:
      contents: read
    uses: ./.github/workflows/quickstart.yml
    with:
      tag: ${{ github.ref_name }}
