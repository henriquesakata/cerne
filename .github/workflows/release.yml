name: release

# A v* tag cross-compiles the release matrix (scripts/build-release.sh stamps
# internal/version.Version), attests the binaries' provenance, publishes a
# GitHub Release with the binaries and SHA256SUMS, and points the Homebrew tap
# at it (F-0410).
on:
  push:
    tags: ['v*']

permissions:
  contents: write
  id-token: write # Sigstore signing of the provenance attestations
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      # The release body is the tag's CHANGELOG.md section. Extracted before the
      # build so a missing section fails the run in seconds, with nothing built.
      - name: extract the release notes
        run: sh scripts/release-notes.sh "$GITHUB_REF_NAME" >"$RUNNER_TEMP/changelog-section.md"
      - run: bash scripts/build-release.sh "$GITHUB_REF_NAME"
      # The MCP Registry listing (F-0455): dist/cerne_<tag>.mcpb (the binaries,
      # the MCPB manifest and its launcher; its hash appended to SHA256SUMS) and
      # dist/server.json pointing at it. Built before the attestation so both
      # are attested and uploaded with the rest of dist/.
      - run: sh scripts/mcpb-bundle.sh "$GITHUB_REF_NAME"
      # Verifiable with `gh attestation verify <file> --repo henriquesakata/cerne`.
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: 'dist/*'
      # Body = the CHANGELOG section, then the fixed Update, Install and Verify blocks.
      # A tag with a hyphen (v1.0.0-rc.1) is published as a pre-release.
      - name: publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes="$RUNNER_TEMP/notes.md"
          sh scripts/release-body.sh "$GITHUB_REF_NAME" "$RUNNER_TEMP/changelog-section.md" >"$notes"
          sh scripts/release-publish.sh "$GITHUB_REF_NAME" "$notes" dist/*
      # The workflow token cannot write to another repository: HOMEBREW_TAP_TOKEN
      # is a fine-grained token with contents:write on henriquesakata/homebrew-tap
      # only. Without it the job fails, so a stale tap never passes in silence.
      # A prerelease tag (v1.0.0-rc.1) leaves the tap alone: brew users get
      # stable releases only.
      - name: check the Homebrew tap token
        if: ${{ !contains(github.ref_name, '-') }}
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          if [ -z "$TAP_TOKEN" ]; then
            echo "::error::HOMEBREW_TAP_TOKEN is not set: the release is published, but the Homebrew tap still installs the previous version"
            exit 1
          fi
      - uses: actions/checkout@v4
        if: ${{ !contains(github.ref_name, '-') }}
        with:
          repository: henriquesakata/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: homebrew-tap
      - name: update the Homebrew tap
        if: ${{ !contains(github.ref_name, '-') }}
        run: |
          mkdir -p homebrew-tap/Formula
          sh scripts/homebrew-formula.sh "$GITHUB_REF_NAME" dist/SHA256SUMS >homebrew-tap/Formula/cerne.rb
          cd homebrew-tap
          git add Formula/cerne.rb
          # A re-run on the same tag has nothing to commit.
          git diff --cached --quiet || git -c user.name='github-actions[bot]' \
            -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit -q -m "cerne $GITHUB_REF_NAME"
          git push -q origin HEAD

  # Install from the tap just updated, the way INSTALL.md says, and check the
  # binary reports the tag (cerne --version prints the full version).
  brew-check:
    needs: release
    if: ${{ !contains(github.ref_name, '-') }}
    permissions:
      contents: read
    strategy:
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: brew install henriquesakata/tap/cerne
        env:
          HOMEBREW_NO_AUTO_UPDATE: '1'
        run: |
          # The Linux runner ships Homebrew off the PATH.
          if ! command -v brew >/dev/null; then eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv)"; fi
          brew install henriquesakata/tap/cerne
          brew test henriquesakata/tap/cerne
          want="cerne ${GITHUB_REF_NAME#v}"
          got=$("$(brew --prefix)/bin/cerne" --version)
          echo "$got"
          if [ "$got" != "$want" ]; then
            echo "::error::brew installed '$got', want '$want'"
            exit 1
          fi

  # Lists the release in the official MCP Registry (F-0455), which Glama,
  # PulseMCP and other directories mirror, from the server.json the release
  # job uploaded. A published version is public and can never be changed or
  # deleted, so this job stays off until the owner has published the first
  # version by hand and then sets the repository variable:
  #   gh release download <tag> --repo henriquesakata/cerne -p server.json
  #   mcp-publisher login github        # as henriquesakata
  #   mcp-publisher publish server.json
  #   gh variable set MCP_REGISTRY_PUBLISH --body true --repo henriquesakata/cerne
  # A prerelease tag (v1.0.0-rc.1) is never published, as with the Homebrew tap.
  # Its own job, so a registry outage leaves the tap and the checks alone.
  mcp-registry:
    needs: release
    if: ${{ !contains(github.ref_name, '-') && vars.MCP_REGISTRY_PUBLISH == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # GitHub OIDC login to the registry, no stored secret
    env:
      MCP_PUBLISHER_VERSION: v1.8.9
    steps:
      - uses: actions/checkout@v4
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      # A pinned release, verified against the registry's own release workflow
      # before it runs (the registry's GitHub Actions guide); never releases/latest.
      - name: download and verify mcp-publisher
        run: |
          set -eu
          archive=mcp-publisher_linux_amd64.tar.gz
          base="https://github.com/modelcontextprotocol/registry/releases/download/$MCP_PUBLISHER_VERSION"
          curl -fsSL -o "$archive" "$base/$archive"
          curl -fsSL -o "$archive.sigstore.json" "$base/$archive.sigstore.json"
          cosign verify-blob --bundle "$archive.sigstore.json" \
            --certificate-identity "https://github.com/modelcontextprotocol/registry/.github/workflows/release.yml@refs/tags/$MCP_PUBLISHER_VERSION" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            "$archive"
          tar xzf "$archive" mcp-publisher
      # Skips a version the registry already has (a re-run on the same tag).
      - name: publish to the MCP Registry
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" -p server.json -D "$RUNNER_TEMP"
          sh scripts/mcp-registry-publish.sh "$RUNNER_TEMP/server.json"

  # The README's commands against the release just published, on Linux and
  # Windows (quickstart.yml).
  quickstart:
    needs: release
    permissions:
      contents: read
    uses: ./.github/workflows/quickstart.yml
    with:
      tag: ${{ github.ref_name }}
