# gitleaks configuration: the default ruleset plus one narrow allowlist.
#
# ui/dist embedded @excalidraw/excalidraw until F-0400 removed it, and its
# bundle shipped excalidraw.com's public Firebase web config
# (VITE_APP_FIREBASE_CONFIG, an "AIza…" key). It is the vendor's public client
# key, not a secret of this project. The current ui/dist no longer carries it,
# but the earlier ui/dist commits do, and this scan reads the whole branch
# history, so the allowlist stays. It requires ALL conditions (AND): one of the
# two rules it trips, a path under ui/dist/, and the VITE_APP_FIREBASE_CONFIG
# marker on the same line — a key anywhere else, or without the marker, is
# still reported.

[extend]
useDefault = true

[[allowlists]]
description = "Excalidraw's public Firebase web config bundled in ui/dist (vendor key, not a project secret)"
condition = "AND"
targetRules = ["gcp-api-key", "generic-api-key"]
paths = ['''^ui/dist/''']
regexTarget = "line"
regexes = ['''VITE_APP_FIREBASE_CONFIG''']

# A fake key in a credentials-file test (F-0414). It is already in the branch
# history, which this scan reads whole, so only this exact value, in this one
# test file, is allowed — any other value there is still reported.
[[allowlists]]
description = "Fake API key used as a sentinel in internal/project/credentials_test.go (F-0414)"
condition = "AND"
targetRules = ["generic-api-key"]
paths = ['''^internal/project/credentials_test\.go$''']
regexTarget = "match"
regexes = ['''sk-test-SECRET-9876''']
